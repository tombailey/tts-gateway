name: GitHub release

on:
  workflow_dispatch:

jobs:
  release-arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rustfmt
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-03-01
          override: true
          components: clippy

      - name: Build
        env:
          TARGET: aarch64-unknown-linux-musl
        run: |
          cargo build --release
          mkdir dist
          mv target/release/api dist/tts-gateway-arm

      - name: Add binary checksum
        run: shasum -a 256 dist/tts-gateway-arm > dist/tts-gateway-arm.sha256

      - uses: actions/attest-build-provenance@v2
        id: attestation
        with:
          subject-path: dist/tts-gateway-arm
      - name: Add binary attestation
        run: mv ${{ steps.attestation.outputs.bundle-path }} dist/attestation-arm.json

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: 0.0.0-${{ github.sha }}
          overwrite: false
          release_name: tts-gateway-0.0.0-${{ github.sha }}
          body: ""

  release-x86:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@c6295a65d1254861815972266d5933fd6e532bdf # v2.11.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-01
          components: rustfmt
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-03-01
          override: true
          components: clippy

      - name: Build
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          cargo build --release
          mkdir dist
          mv target/release/api dist/tts-gateway-x86

      - name: Add binary checksum
        run: shasum -a 256 dist/tts-gateway-x86 > dist/tts-gateway-x86.sha256

      - uses: actions/attest-build-provenance@v2
        id: attestation
        with:
          subject-path: dist/tts-gateway-x86
      - name: Add binary attestation
        run: mv ${{ steps.attestation.outputs.bundle-path }} dist/attestation-x86.json

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: 0.0.0-${{ github.sha }}
          overwrite: false
          release_name: tts-gateway-0.0.0-${{ github.sha }}
          body: ""
